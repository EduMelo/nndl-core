name: Maven Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Install dhall-json
        run: |
          curl -fsSL -o /tmp/dhall-json.tar.bz2 https://github.com/dhall-lang/dhall-haskell/releases/download/1.42.2/dhall-json-1.7.12-x86_64-linux.tar.bz2
          tar -xjf /tmp/dhall-json.tar.bz2 -C /tmp
          sudo mv /tmp/bin/dhall-to-json /usr/local/bin/dhall-to-json
          dhall-to-json --version

      - name: Install Selenium Server JAR
        run: |
          curl -fsSL -o selenium-server-4.21.0.jar https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.21.0/selenium-server-4.21.0.jar
          mvn install:install-file -Dfile=selenium-server-4.21.0.jar -DgroupId=org.seleniumhq.selenium -DartifactId=selenium-server -Dversion=4.21.0 -Dpackaging=jar

      - name: Test
        run: mvn test
