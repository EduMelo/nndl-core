name: Maven Package

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          server-id: github
          server-password: REPOSITORY_TOKEN

      - name: Install dhall-json
        run: |
          curl -fsSL -o /tmp/dhall-json.tar.bz2 https://github.com/dhall-lang/dhall-haskell/releases/download/1.42.2/dhall-json-1.7.12-x86_64-linux.tar.bz2
          tar -xjf /tmp/dhall-json.tar.bz2 -C /tmp
          sudo mv /tmp/bin/dhall-to-json /usr/local/bin/dhall-to-json

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy
        env:
          REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
