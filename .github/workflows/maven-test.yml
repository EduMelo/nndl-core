name: Maven Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Install dhall-json
        run: |
          curl -fsSL -o /tmp/dhall-json.tar.bz2 https://github.com/dhall-lang/dhall-haskell/releases/download/1.42.2/dhall-json-1.7.12-x86_64-linux.tar.bz2
          tar -xjf /tmp/dhall-json.tar.bz2 -C /tmp
          sudo mv /tmp/bin/dhall-to-json /usr/local/bin/dhall-to-json
          dhall-to-json --version

      - name: Test
        run: mvn test
