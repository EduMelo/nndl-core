# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  push:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3
    - name: Place Settings
      run: |
        echo "${{ secrets.MAVEN_SETTINGS }}" | base64 -d > ${{ github.workspace }}/settings

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: temurin
        overwrite-settings: false

    - name: Install dhall-json
      run: |
        curl -fsSL -o /tmp/dhall-json.tar.bz2 https://github.com/dhall-lang/dhall-haskell/releases/download/1.42.2/dhall-json-1.7.12-x86_64-linux.tar.bz2
        tar -xjf /tmp/dhall-json.tar.bz2 -C /tmp
        sudo mv /tmp/bin/dhall-to-json /usr/local/bin/dhall-to-json

    - name: Download Selenium Server JAR
      run: |
        curl -L -o selenium-server-4.21.0.jar https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.21.0/selenium-server-4.21.0.jar

    - name: Install Selenium Server JAR to local Maven repository
      run: |
        mvn install:install-file -Dfile=selenium-server-4.21.0.jar -DgroupId=org.seleniumhq.selenium -DartifactId=selenium-server -Dversion=4.21.0 -Dpackaging=jar

    - name: Publish to GitHub Packages Apache Maven
      run: mvn clean deploy
      env:
        GITHUB_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
